
name: Build ReelFren APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q ReelFren-Project.zip -d source
          ls -la source/ReelFren

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        run: gradle -p source/ReelFren assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReelFren-APK
          path: source/ReelFren/app/build/outputs/apk/debug/app-debug.apk
